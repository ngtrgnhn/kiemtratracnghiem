<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Chờ thêm chút</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      position: relative;
    }

    /* ===== BACKGROUND EFFECT ===== */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 14s ease-in-out infinite;
    }

    .blob-red {
      width: 420px;
      height: 420px;
      background: #e63946;
      top: -150px;
      left: -150px;
    }

    .blob-blue {
      width: 500px;
      height: 500px;
      background: #1d4ed8;
      bottom: -180px;
      right: -180px;
      animation-delay: 4s;
    }

    .blob-white {
      width: 300px;
      height: 300px;
      background: #94a3b8;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.15;
      animation-delay: 7s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(60px, -50px) scale(1.2); }
    }

    /* Lưới mờ chuyển động */
    .grid {
      position: absolute;
      inset: -50%;
      background-image:
        linear-gradient(rgba(29, 78, 216, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230, 57, 70, 0.06) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: scroll 20s linear infinite;
    }

    @keyframes scroll {
      from { transform: translate(0, 0); }
      to   { transform: translate(50px, 50px); }
    }

    /* ===== NỘI DUNG ===== */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
    }

    .error-code {
      font-size: clamp(120px, 28vw, 240px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      user-select: none;
    }

    .digit {
      display: inline-block;
      animation: bounce 2.4s ease-in-out infinite;
    }

    .digit.red {
      color: #e63946;
      text-shadow: 0 0 40px rgba(230, 57, 70, 0.5);
      animation-delay: 0s;
    }

    .digit.blue {
      color: #1d4ed8;
      text-shadow: 0 0 40px rgba(29, 78, 216, 0.5);
      animation-delay: 0.3s;
    }

    .digit.red:nth-child(3) {
      animation-delay: 0.6s;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-18px); }
    }

    /* ===== DÒNG CHỮ ===== */
    .message {
      margin-top: 16px;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #1d4ed8;
      animation: fade 2.4s ease-in-out infinite;
    }

    @keyframes fade {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Hiệu ứng nền -->
  <div class="bg">
    <div class="grid"></div>
    <div class="blob blob-red"></div>
    <div class="blob blob-blue"></div>
    <div class="blob blob-white"></div>
  </div>

  <!-- Nội dung -->
  <main class="container">
    <h1 class="error-code">
      <span class="digit red">4</span><span class="digit blue">0</span><span class="digit red">4</span>
    </h1>
    <p class="message">Chờ thêm chút</p>
  </main>
</body>
</html>
