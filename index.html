<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Chờ thêm chút</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      position: relative;
    }

    /* ===== BACKGROUND EFFECT ===== */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 14s ease-in-out infinite;
    }

    .blob-red {
      width: 420px;
      height: 420px;
      background: #e63946;
      top: -150px;
      left: -150px;
    }

    .blob-blue {
      width: 500px;
      height: 500px;
      background: #1d4ed8;
      bottom: -180px;
      right: -180px;
      animation-delay: 4s;
    }

    .blob-white {
      width: 300px;
      height: 300px;
      background: #94a3b8;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.15;
      animation-delay: 7s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(60px, -50px) scale(1.2); }
    }

    .grid {
      position: absolute;
      inset: -50%;
      background-image:
        linear-gradient(rgba(29, 78, 216, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230, 57, 70, 0.06) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: scroll 20s linear infinite;
    }

    @keyframes scroll {
      from { transform: translate(0, 0); }
      to   { transform: translate(50px, 50px); }
    }

    /* ===== NỘI DUNG ===== */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
    }

    .error-code {
      font-size: clamp(120px, 28vw, 240px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
      user-select: none;
    }

    .digit {
      display: inline-block;
      animation: bounce 2.4s ease-in-out infinite;
    }

    .digit.red {
      color: #e63946;
      text-shadow: 0 0 40px rgba(230, 57, 70, 0.5);
      animation-delay: 0s;
    }

    .digit.blue {
      color: #1d4ed8;
      text-shadow: 0 0 40px rgba(29, 78, 216, 0.5);
      animation-delay: 0.3s;
    }

    .digit.red:nth-child(3) {
      animation-delay: 0.6s;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-18px); }
    }

    /* ===== DÒNG CHỮ ===== */
    .message {
      margin-top: 16px;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #1d4ed8;
      animation: fade 2.4s ease-in-out infinite;
    }

    @keyframes fade {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1; }
    }

    /* ===== LIÊN HỆ ===== */
    .contact {
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 15px;
      font-weight: 500;
      color: #475569;
    }

    .contact .social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f1f5f9;
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .contact .social svg {
      width: 20px;
      height: 20px;
    }

    .contact .social.fb {
      color: #1877f2;
    }

    .contact .social.tiktok {
      color: #000000;
    }

    .contact .social:hover {
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      background: #ffffff;
    }

    .contact .social.fb:hover {
      box-shadow: 0 8px 16px rgba(24, 119, 242, 0.35);
    }

    .contact .social.tiktok:hover {
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
    }

    /* ===== GHI CHÚ NHỎ ===== */
    .note {
      margin-top: 14px;
      font-size: 13px;
      font-style: italic;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    @media (max-width: 400px) {
      .contact { font-size: 13px; }
      .contact .social { width: 32px; height: 32px; }
      .contact .social svg { width: 18px; height: 18px; }
      .note { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- Hiệu ứng nền -->
  <div class="bg">
    <div class="grid"></div>
    <div class="blob blob-red"></div>
    <div class="blob blob-blue"></div>
    <div class="blob blob-white"></div>
  </div>

  <!-- Nội dung -->
  <main class="container">
    <h1 class="error-code">
      <span class="digit red">4</span><span class="digit blue">0</span><span class="digit red">4</span>
    </h1>
    <p class="message">Chờ thêm chút</p>

    <!-- Liên hệ -->
    <div class="contact">
      <span>Buồn thì inbox nói chuyện</span>

      <a class="social fb" href="https://facebook.com/ngtrgnhn" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.52 1.49-3.91 3.78-3.91 1.1 0 2.24.2 2.24.2v2.47h-1.26c-1.24 0-1.63.78-1.63 1.57v1.88h2.78l-.45 2.91h-2.33V22c4.78-.79 8.44-4.94 8.44-9.94z"/>
        </svg>
      </a>

      <a class="social tiktok" href="https://tiktok.com/@_bbinn_" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
        </svg>
      </a>
    </div>

    <!-- Ghi chú nhỏ -->
    <p class="note">inbox mai trả lời</p>
  </main>
</body>
</html>
